server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: http://localhost:8080
              predicates:
                - Path=/auth/**

            - id: transaction-service-route
              uri: http://localhost:8080
              predicates:
                - Path=/api/transactions/**

            - id: case-management-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/api/cases/**

