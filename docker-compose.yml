services:

  # ==================== Database ====================

  mysql-transactions:
    image: mysql:8.0
    restart: unless-stopped
    environment:
        MYSQL_ROOT_PASSWORD: "0000"
        MYSQL_DATABASE: transaction_db
        MYSQL_USER: "eyatrooz"
        MYSQL_PASSWORD: "0000"
    ports:
      - "3307:3306"
    volumes:
      - mysql_transactions-data:/var/lib/mysql

  mysql-rule-engine:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: rule_engine_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"

    ports:
      - "3308:3306"
    volumes:
      - mysql_rule_engine_data:/var/lib/mysql

  mysql-case-management:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: case_management_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"

    ports:
      - "3309:3306"

    volumes:
      - mysql_case_management_data:/var/lib/mysql

  mysql-audit:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: audit_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"
    ports:
      - "3310:3306"
    volumes:
      - mysql_audit_data:/var/lib/mysql




  # ==================== Kafka ====================

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


  # ==================== Services ====================

  transaction-service:
      build:
        context: ./transaction-service
      container_name: transaction-service
      ports:
        - "8080:8080"
      depends_on:
        - mysql-transactions
        - kafka
      environment:
        SPRING_PROFILES_ACTIVE: docker
      restart: unless-stopped


  rule-engine-service:
      build:
        context: ./rule-engine-service
      container_name: rule-engine-service
      ports:
        - "8082:8082"
      depends_on:
        - mysql-rule-engine
        - kafka
      environment:
        SPRING_PROFILES_ACTIVE: docker
      restart: unless-stopped

  case-management-service:
      build:
        context: ./case-management-service
      container_name: case-management-service
      ports:
        - "8083:8083"
      depends_on:
        - mysql-case-management
        - kafka
      environment:
        SPRING_PROFILES_ACTIVE: docker
      restart: unless-stopped

  audit-service:
      build:
        context: ./audit-service
      container_name: audit-service
      ports:
        - "8085:8085"
      depends_on:
        - mysql-audit
        - kafka
      environment:
        SPRING_PROFILES_ACTIVE: docker
      restart: unless-stopped


# ==================== Volumes ====================

volumes:
  mysql_transactions-data:
  mysql_rule_engine_data:
  mysql_case_management_data:
  mysql_audit_data:






