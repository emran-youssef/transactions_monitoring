services:

  # ==================== Database ====================

  mysql-transactions:
    image: mysql:8.0
    environment:
        MYSQL_ROOT_PASSWORD: "0000"
        MYSQL_DATABASE: transaction_db
        MYSQL_USER: "eyatrooz"
        MYSQL_PASSWORD: "0000"
    ports:
      - "3307:3306"
    volumes:
      - mysql_transactions-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ueyatrooz", "-p0000" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-rule-engine:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: rule_engine_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"

    ports:
      - "3308:3306"
    volumes:
      - mysql_rule_engine_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ueyatrooz", "-p0000" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-case-management:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: case_management_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"

    ports:
      - "3309:3306"

    volumes:
      - mysql_case_management_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ueyatrooz", "-p0000" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-audit:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: audit_db
      MYSQL_USER: "eyatrooz"
      MYSQL_PASSWORD: "0000"
    ports:
      - "3310:3306"
    volumes:
      - mysql_audit_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ueyatrooz", "-p0000" ]
      interval: 10s
      timeout: 5s
      retries: 10



  # ==================== Kafka ====================

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
      # - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


